<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TC Hunter</title><link rel="stylesheet" href="style.css"></head>
<body>
  <h1>TC Hunter</h1>
  <div id="status" role="status"></div>
  <div id="main" hidden>
    <label>Which job is this form for?<select id="app"></select></label>
    <ol class="steps">
      <li><button id="read">Read this form</button><div class="hint">TC Hunter suggests an answer for each question. You check them in TC Hunter.</div></li>
      <li><button id="fill">Fill the form</button><div class="hint">Types only the answers you approved. Questions that are yours stay empty and are outlined.</div></li>
      <li><button id="done" class="secondary">I submitted it</button><div class="hint">After you press Submit on their site yourself.</div></li>
    </ol>
  </div>
  <p class="foot"><a href="options.html" target="_blank">Settings</a></p>
  <script src="popup.js"></script>
</body>
</html>
