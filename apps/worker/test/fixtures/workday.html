<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Analyst - Wingtip Careers</title></head>
<body>
<!-- A sandbox shaped like a Workday careers site, with Workday's data-automation-id names (local test only). -->
<div id="app"></div>
<script>
  var S = JSON.parse(localStorage.getItem("wd") || "{}");
  function save() { localStorage.setItem("wd", JSON.stringify(S)); }
  var app = document.getElementById("app");
  function h(html) { app.innerHTML = html; }
  function on(id, fn) { var el = document.querySelector('[data-automation-id="' + id + '"]'); if (el) el.addEventListener("click", fn); }
  function val(id) { return document.querySelector('[data-automation-id="' + id + '"]').value; }
  function jobPage() {
    h('<h2>Analyst</h2><p>Wingtip is hiring.</p><a href="#" data-automation-id="adventureButton">Apply</a>');
    on("adventureButton", function (e) { e.preventDefault();
      h('<div role="dialog"><a href="#" data-automation-id="autofillWithResume">Autofill with Resume</a> <a href="#" data-automation-id="applyManually">Apply Manually</a></div>');
      on("applyManually", function (e) { e.preventDefault(); signInPage(); });
    });
  }
  // Workday's newer sign-in page (?v=new): Apple, Google or email, with the email boxes shown only after "Sign in with email".
  // With &late=1 the three buttons are drawn a moment after the page, and the email one carries no automation id.
  var NEW = location.search.indexOf("v=new") >= 0, LATE = location.search.indexOf("late=1") >= 0, revealed = false;
  function signInPage() {
    if (NEW && !revealed) {
      h('<div data-automation-id="signInContent"><h2>Sign In</h2><div id="sso"></div></div>');
      var draw = function () {
        if (!document.getElementById("sso")) return;
        document.getElementById("sso").innerHTML = '<button data-automation-id="SignInWithAppleButton">Sign in with Apple</button>' +
          '<button data-automation-id="SignInWithGoogleButton">Sign in with Google</button><p>or</p>' +
          (LATE ? '<div role="button" tabindex="0" id="byEmail"><span>Sign in with email</span></div>' : '<button data-automation-id="SignInWithEmailButton">Sign in with email</button>');
        var b = LATE ? document.getElementById("byEmail") : document.querySelector('[data-automation-id="SignInWithEmailButton"]');
        b.addEventListener("click", function () { revealed = true; signInPage(); });
      };
      if (LATE) setTimeout(draw, 2500); else draw();
      return;
    }
    // With &bar=1 the step bar shows on the sign-in page too, as on newer sites (Premier).
    h((location.search.indexOf("bar=1") >= 0 ? bar(1, "Create Account/Sign In") : "") +
      '<div data-automation-id="signInContent"><h2>Sign In</h2><label for="e">Email Address</label><input id="e" data-automation-id="email">' +
      '<label for="p">Password</label><input id="p" type="password" data-automation-id="password">' +
      '<button data-automation-id="signInSubmitButton">Sign In</button> <a href="#" data-automation-id="createAccountLink">Create Account</a>' +
      ' <a href="#" data-automation-id="forgotPasswordLink">Forgot your password?</a><p id="msg"></p></div>');
    on("createAccountLink", function (e) { e.preventDefault(); createPage(); });
    on("forgotPasswordLink", function (e) { e.preventDefault(); forgotPage(); });
    on("signInSubmitButton", function () {
      var a = S.account;
      if (!a || a.email !== val("email") || a.password !== val("password")) { document.getElementById("msg").textContent = "Wrong email or password."; return; }
      if (!a.verified) { document.getElementById("msg").textContent = "Please verify your account. We sent you an email."; return; }
      S.step = S.step || 1; save(); formPage();
    });
  }
  function forgotPage() {
    h('<h2>Forgot Password</h2><label for="fe">Email Address</label><input id="fe" data-automation-id="email">' +
      '<button data-automation-id="resetPasswordSubmitButton">Submit</button>');
    on("resetPasswordSubmitButton", function () { S.resetFor = val("email"); save(); h("<p>If an account exists for this email, we've sent instructions to reset your password.</p>"); });
  }
  function resetPage() {
    h('<h2>Reset Password</h2><label for="np">New Password</label><input id="np" type="password"><label for="vp">Verify New Password</label><input id="vp" type="password">' +
      '<button>Submit</button>');
    document.querySelector("button").addEventListener("click", function () {
      var a = document.getElementById("np").value;
      if (!S.resetFor || a !== document.getElementById("vp").value) return;
      S.account = { email: S.resetFor, password: a, verified: true }; save(); h("<p>Your password was changed.</p>");
    });
  }
  function createPage() {
    h('<h2>Create Account</h2><label for="ce">Email Address</label><input id="ce" data-automation-id="email">' +
      '<label for="cp">Password</label><input id="cp" type="password" data-automation-id="password">' +
      '<label for="cv">Verify New Password</label><input id="cv" type="password" data-automation-id="verifyPassword">' +
      '<label><input type="checkbox" data-automation-id="createAccountCheckbox"> I agree to the terms and conditions</label>' +
      '<button data-automation-id="createAccountSubmitButton">Create Account</button>');
    on("createAccountSubmitButton", function () {
      if (!document.querySelector('[data-automation-id="createAccountCheckbox"]').checked) return;
      if (val("password") !== val("verifyPassword")) return;
      S.account = { email: val("email"), password: val("password"), verified: false }; save();
      // With &quiet=1 the site goes straight back to Sign In and says nothing (Premier, 2026-11-16).
      if (location.search.indexOf("quiet=1") >= 0) {
        revealed = false;
        // With &blank=1 the page is empty for a moment first, then shows a message that fades (Premier).
        if (location.search.indexOf("blank=1") >= 0) {
          h("<p>Talent Network</p>");
          setTimeout(function () { signInPage(); var m = document.createElement("p"); m.id = "fade"; m.textContent = "We sent you an email. Please verify your account."; app.appendChild(m);
            setTimeout(function () { var f = document.getElementById("fade"); if (f) f.remove(); }, 2500); }, 3500);
          return;
        }
        signInPage(); return;
      }
      h("<p>We sent a verification email to you. Please check your email to activate your account.</p>");
    });
  }
  function bar(n, title) {
    return '<div data-automation-id="progressBar"><span data-automation-id="progressBarActiveStep">current step ' + n + ' of 3 ' + title + '</span></div>';
  }
  var drawn = false;
  function formPage() {
    // Like Workday: the page frame and its buttons come first, the questions a moment later.
    if (S.step === 1 && !drawn) {
      drawn = true;
      h(bar(1, "My Information") + '<button data-automation-id="pageFooterNextButton">Save and Continue</button>');
      setTimeout(formPage, 2000); return;
    }
    if (S.step === 1) {
      h(bar(1, "My Information") + '<div data-automation-id="formField-source"><label id="src-l">How Did You Hear About Us? *</label>' +
        '<button aria-haspopup="listbox" aria-labelledby="src-l" id="src" data-automation-id="sourceDropdown">Select One</button><ul role="listbox" id="src-list" hidden>' +
        '<li role="option">Job Board</li><li role="option">Company Website</li></ul></div>' +
        '<div data-automation-id="formField-countryPhoneCode"><label for="pc">Country Phone Code*</label><div data-automation-id="multiSelectContainer"><input id="pc" placeholder="Search"></div>' +
        '<ul role="listbox" id="pc-list"></ul><div id="pc-sel"></div></div>' +
        '<div data-automation-id="formField-legalNameSection_firstName"><label for="fn">Given Name(s) *</label><input id="fn" data-automation-id="legalNameSection_firstName" aria-required="true"></div>' +
        '<div data-automation-id="formField-legalNameSection_lastName"><label for="ln">Family Name *</label><input id="ln" data-automation-id="legalNameSection_lastName" aria-required="true" value="Prefilled"></div>' +
        '<p data-automation-id="errorMessage" id="err" hidden></p>' +
        '<button data-automation-id="pageFooterNextButton">Save and Continue</button>');
      var btn = document.getElementById("src"), list = document.getElementById("src-list");
      btn.addEventListener("click", function () { list.hidden = false; });
      // Like Workday's grouped list: "Job Board" opens its own choices instead of being chosen.
      function pickable(li) { li.addEventListener("click", function () {
        if (li.textContent === "Job Board") { list.innerHTML = '<li role="option">Indeed</li><li role="option">Other Job Board</li>'; list.querySelectorAll("li").forEach(pickable); return; }
        btn.textContent = li.textContent; list.hidden = true; }); }
      list.querySelectorAll("li").forEach(pickable);
      // Like Workday's search list: typed words are looked up on Enter; the choice shows beside the box.
      var pc = document.getElementById("pc"), pcl = document.getElementById("pc-list");
      // Opened, it shows only its first few choices (Premier: Afghanistan to Anguilla); typing then Enter searches all of them.
      function shown(list) {
        pcl.innerHTML = list.map(function (c) { return '<li data-automation-id="promptOption">' + c + '</li>'; }).join("");
        pcl.querySelectorAll("li").forEach(function (li) { li.addEventListener("click", function () {
          document.getElementById("pc-sel").innerHTML = '<span data-automation-id="selectedItem">' + li.textContent + '</span>'; pcl.innerHTML = ""; pc.value = ""; }); });
      }
      pc.addEventListener("click", function () { shown(["Afghanistan (+93)", "Albania (+355)"]); });
      pc.addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return; e.preventDefault();
        shown(["Afghanistan (+93)", "Albania (+355)", "Canada (+1)", "United States of America (+1)"].filter(function (c) { return c.toLowerCase().indexOf(pc.value.toLowerCase()) >= 0; }));
      });
      on("pageFooterNextButton", function () {
        if (btn.textContent === "Select One" || !document.getElementById("fn").value || !document.querySelector("#pc-sel [data-automation-id=selectedItem]")) { var e = document.getElementById("err"); e.hidden = false; e.textContent = "Errors found: How Did You Hear About Us? is required"; return; }
        S.step = 2; save(); formPage();
      });
    } else if (S.step === 2) {
      h(bar(2, "My Experience") + '<div data-automation-id="formField-resume"><h3>Resume/CV</h3><input type="file" data-automation-id="file-upload-input-ref" id="up"></div>' +
        '<button data-automation-id="pageFooterNextButton">Save and Continue</button>');
      on("pageFooterNextButton", function () { if (!document.getElementById("up").files.length) return; S.step = 3; save(); formPage(); });
    } else if (S.step === 3) {
      h(bar(3, "Review") + '<main><p>Given Name(s): Yong</p><p>Resume: attached</p></main><button data-automation-id="pageFooterNextButton">Submit</button>');
      on("pageFooterNextButton", function () { S.step = 4; S.submitted = (S.submitted || 0) + 1; save(); h("<h2>Application Submitted</h2><p>Thanks for applying!</p>"); });
    }
  }
  if (location.pathname.indexOf("/reset") >= 0) resetPage();
  else if (location.pathname.indexOf("/verify") >= 0) { if (S.account) { S.account.verified = true; save(); } h("<p>Your account is verified.</p>"); }
  else jobPage();
</script>
</body></html>
