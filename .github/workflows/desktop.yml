name: Desktop app

# TC Hunter desktop app (desktop/): built on a Mac runner. Pull requests build it and keep the
# installer as a run artifact; main publishes it as a GitHub release, desktop-v<version>.
on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build the installer (unsigned, ad hoc signature)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Sizes
        run: |
          ls -la dist/*.dmg dist/*.zip
          du -sh dist/mac-arm64/*.app dist/mac/*.app
      - name: Proof mode starts (no network read; checks the app opens and quits)
        run: |
          "dist/mac-arm64/TC Hunter.app/Contents/MacOS/TC Hunter" --proof || true
      - uses: actions/upload-artifact@v4
        with:
          name: tc-hunter-desktop
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          retention-days: 14
      - name: Publish the release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="desktop-v$(node -p 'require("./package.json").version')"
          if gh release view "$v" >/dev/null 2>&1; then
            gh release upload "$v" dist/*.dmg dist/*.zip --clobber
          else
            gh release create "$v" dist/*.dmg dist/*.zip --title "TC Hunter desktop app $(node -p 'require("./package.json").version')" \
              --notes "Download TC-Hunter-…-arm64.dmg for a Mac with an M-series chip, or TC-Hunter-…-x64.dmg for an Intel Mac. See docs/desktop.md for the install steps."
          fi
